# Workflow: Build Fedora CoreOS Images for pow
# Purpose: Dynamically discovers configurations in .config/, creates a build matrix,
#          compares Fedora versions against 'stable', generates unique image tags,
#          and builds/signs the containers.
name: Build Fedora CoreOS

on:
  push:
    paths-ignore:
      - "**.md"
  schedule:
    - cron: '15 15 * * 3'
  workflow_dispatch:
    inputs:
      target_major:
        description: 'Manual override for major version (e.g., 40).'
        required: false
        default: ''

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      configs: ${{ steps.set-matrix.outputs.configs }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Discover Configurations
        id: set-matrix
        run: |
          set -euxo pipefail

          CONFIGS=()
          
          # Find all files in .config directory and format as a JSON array
          for file in .config/*; do
            [ -e "$file" ] || continue
            filename=$(basename "$file")

            # If this is a push event, check if the build_on_push flag is
            # set to false in the configuration file. If so, skip this config.
            if [[ "${{ github.event_name }}" == "push" ]]; then
              if jq -e '.build_on_push == false' "$file" > /dev/null 2>&1; then
                echo "Skipping $filename due to build_on_push=false"
                continue
              fi
            fi
            CONFIGS+=("$filename")
          done  

          JSON_CONFIGS=$(printf '%s\n' "${CONFIGS[@]}" | jq -R -s -c 'split("\n")[:-1]')

          echo "configs=$JSON_CONFIGS" >> $GITHUB_OUTPUT
          echo "Detected configs: $JSON_CONFIGS"

  build:
    needs: detect
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.detect.outputs.configs) }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Log into Github Container Registry
        id: log-into-ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load and Merge Config
        id: load-config
        run: |
          set -euxo pipefail
          CONFIG_FILE=".config/${{ matrix.config }}"
          
          # Recursive function with depth tracking and schema-aware merging
          resolve_config() {
              local current_file="$1"
              local depth="${2:-0}"
              
              if [ "$depth" -gt 5 ]; then
                  echo "Error: Maximum inheritance depth exceeded in $current_file" >&2
                  exit 1
              fi
              
              if [ ! -f "$current_file" ]; then
                  echo "Error: Config file not found: $current_file" >&2
                  exit 1
              fi

              if jq -e '.extends' "$current_file" >/dev/null 2>&1; then
                  local parent_ref
                  parent_ref="$(jq -r '.extends' "$current_file")"
                  local base_file
                  base_file="$(dirname "$current_file")/$parent_ref"
                  
                  # Recursively resolve parent, then combine using a schema-aware jq filter:
                  # - arguments: objects are merged
                  # - containers/packages/repos: arrays are concatenated and deduplicated
                  # - selinux.booleans: combined and deduplicated by 'name'
                  jq -s '
                    def deep_merge(base; child):
                      base
                      | .arguments = ((base.arguments // {}) * (child.arguments // {}))
                      | .containers = (((base.containers // []) + (child.containers // [])) | unique)
                      | .packages = (((base.packages // []) + (child.packages // [])) | unique)
                      | .repos = (((base.repos // []) + (child.repos // [])) | unique)
                      | .selinux.booleans = (((base.selinux.booleans // []) + (child.selinux.booleans // [])) | unique_by(.name))
                      | .build_on_push = (child.build_on_push // base.build_on_push // true);
                    
                    deep_merge(.[0]; .[1])
                  ' "$(resolve_config "$base_file" $((depth + 1)))" "$current_file"
              else
                  cat "$current_file"
              fi
          }

          MERGED_TEMP=$(mktemp)
          resolve_config "$CONFIG_FILE" > "$MERGED_TEMP"

          # Validate final JSON structure
          if ! jq empty "$MERGED_TEMP" 2>/dev/null; then
              echo "Error: Merged configuration results in invalid JSON." >&2
              cat "$MERGED_TEMP"
              exit 1
          fi

          # 1. Map arguments to GITHUB_ENV
          jq -r '.arguments // {} | to_entries[] | "\(.key)=\(.value)"' "$MERGED_TEMP" >> $GITHUB_ENV
          
          # 2. Generate BUILD_ARGS string for Buildah
          BUILD_ARGS=$(jq -r '.arguments // {} | to_entries[] | "--build-arg \(.key)=\(.value)"' "$MERGED_TEMP" | xargs)
          echo "BUILD_ARGS=$BUILD_ARGS" >> $GITHUB_ENV

          echo "Config loaded and deep-merged via jq from ${{ matrix.config }}"
          rm -f "$MERGED_TEMP"

      - name: Get Versions
        id: get-versions
        run: |
          set -euxo pipefail

          REPO="quay.io/fedora/fedora-coreos"
          ALL_TAGS=$(skopeo list-tags docker://$REPO | jq -r '.Tags[]')

          if [ -n "${{ github.event.inputs.target_major }}" ]; then
            TARGET_MAJOR="${{ github.event.inputs.target_major }}"
          elif [ -n "$FEDORA_VERSION" ]; then
            TARGET_MAJOR="$FEDORA_VERSION"
          else
            echo "Error: No major version specified."
            exit 1
          fi

          TARGET_TAG=$(echo "$ALL_TAGS" | grep -E "^$TARGET_MAJOR\." | sort -V | tail -n 1)

          if [ -z "$TARGET_TAG" ]; then
            echo "Error: Could not find tag for major version $TARGET_MAJOR"
            exit 1
          fi

          echo "target_tag=$TARGET_TAG" >> $GITHUB_OUTPUT

      - name: Check Stable Version
        id: check-stable
        continue-on-error: true
        run: |
          set -euxo pipefail

          STABLE_REPO="quay.io/fedora/fedora-coreos:stable"
          STABLE_VERSION=$(skopeo inspect docker://$STABLE_REPO | jq -r '.Labels["org.opencontainers.image.version"] // empty')

          if [[ ! $STABLE_VERSION =~ ^[0-9]+(\.[0-9]+){3}$ ]]; then
            echo "Error: Could not find valid version in 'org.opencontainers.image.version' label. Found: '$STABLE_VERSION'"
            exit 1
          fi

          STABLE_MAJOR=$(echo "$STABLE_VERSION" | cut -d. -f1)

          if [ "$STABLE_MAJOR" -gt "$FEDORA_VERSION" ]; then
            echo "::warning:: The 'stable' image ($STABLE_VERSION) is newer than the configured FEDORA_VERSION ($FEDORA_VERSION)!"
            exit 1
          fi

      - name: Generate Image Tags
        id: generate-tags
        run: |
          set -euxo pipefail

          TIMESTAMP=$(date +%Y%m%d%H%M)
          BRANCH_NAME="${{ github.ref_name }}"
          CONFIG_NAME="${{ matrix.config }}"
          TAGS=()
          
          # Include configuration name in tags to prevent multi-config tag collisions
          if [ "$BRANCH_NAME" = "main" ]; then
            TAGS+=("$CONFIG_NAME-latest")
            TAGS+=("$CONFIG_NAME-$FEDORA_VERSION.$TIMESTAMP")
            TAGS+=("$CONFIG_NAME-$FEDORA_VERSION")
          else
            TAGS+=("$BRANCH_NAME-$CONFIG_NAME")
            TAGS+=("$BRANCH_NAME-$CONFIG_NAME-$FEDORA_VERSION.$TIMESTAMP")
            TAGS+=("$BRANCH_NAME-$CONFIG_NAME-$FEDORA_VERSION")
          fi
          TAG_STRING="${TAGS[*]}"

          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          echo "IMAGE_TAGS=$TAG_STRING" >> $GITHUB_ENV
          echo "Generated Tags: $TAG_STRING"

      - name: Define Image Metadata
        id: define-image-metadata
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ github.event.repository.name }}
          labels: |
            io.artifacthub.package.readme-url="https://${{ github.repository }}/blob/${{ github.ref_name }}/README.md"
            org.opencontainers.image.description="An image derived from Fedora CoreOS ${{ env.FEDORA_VERSION }} for the ${{ github.event.repository.name }} project (${{ matrix.config }})"
            org.opencontainers.image.source="https://github.com/${{ github.repository }}"
            org.opencontainers.image.title="${{ github.event.repository.name }}-${{ matrix.config }}"
            org.opencontainers.image.version="${{ env.FEDORA_VERSION }}.${{ env.TIMESTAMP }}"

      - name: Build Image
        id: build-image
        uses: redhat-actions/buildah-build@v3
        with:
          containerfiles: |
            ./core/Containerfile
          context: .
          image: ${{ github.event.repository.name }}
          tags: |
            ${{ env.IMAGE_TAGS }}
          extra-args: |
            ${{ env.BUILD_ARGS }}
            --build-arg COREOS_VERSION=${{ steps.get-versions.outputs.target_tag }}
          labels: ${{ steps.define-image-metadata.outputs.labels }}
          oci: false

      - name: Push to Registry
        id: push-to-registry
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ghcr.io/${{ github.repository_owner }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
          extra-args: |
            --disable-content-trust

      - name: Sign image
        id: sign-image
        run: |
          set -euxo pipefail

          # Sign the image digest.
          cosign sign --yes ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}@${{ steps.push-to-registry.outputs.digest }}